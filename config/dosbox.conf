[sdl]
output = opengl
fullscreen = off
window_size = large
window_titlebar = program='DIS Estadistica' dosbox=auto cycles=off mouse=none
keyboard_capture = off

[dosbox]
language = es
machine = svga_s3
memsize = 16

[render]
aspect = on
integer_scaling = auto

[cpu]
core = auto
cpu_cycles = 10000
cpu_cycles_protected = 30000

[capture]
capture_dir = capture

[mouse]
mouse_capture = seamless

[mixer]
nosound = on

[midi]
mididevice = none

[sblaster]
sbtype = none

[gus]
gus = off

[serial]
serial1 = disabled
serial2 = disabled
serial3 = disabled
serial4 = disabled

[dos]
xms = on
ems = on
umb = on
locale_period = historic
country = 54
keyboard_layout = la 850

[ipx]
ipx = off
